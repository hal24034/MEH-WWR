<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: rgb(120, 96, 64); /* dark background outside the container */
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
}
#maincontainer {
    background-color: white;
    border: 10px solid navy;
    border-radius: 10px;
    max-width: 600px;
    width: 100%;
    overflow: hidden;
    position: relative;
}
#topimg {
    width: 100%;
    display: block;
}
#topimgcontainer {
    position: relative;
}
#topimgcontainer::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
}
#whitetext, #whitetext2 {
    position: absolute;
    color: white;
    z-index: 1;
    text-align: center;
    width: 100%;
}
#whitetext {
    top: 15%;
    font-size: 2.5rem;
}
#whitetext2 {
    top: 30%;
    font-size: 1.5rem;
}
#closeBtn {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;
    background: none;
    border: none;
    color: white;
    font-size: 1.5rem;
    cursor: pointer;
}
#formContainer {
    padding: 20px;
}
#bookContainer {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    padding: 5px;
}
#bookContainer img {
    width: 100%;
    height: auto;
}   
#formContainer label {
    display: block;
    margin-bottom: 5px;
}
#formContainer input[type="text"],
#formContainer input[type="password"],
#formContainer input[type="email"] {
    display: block;
    width: 100%;
    margin-bottom: 15px;
    padding: 5px;
}
#formContainer section {
    margin-bottom: 10px;
}   
#formContainer div {
    display: flex;
    gap: 20px;
}   
    </style>




</head>

<body>
    <div id="maincontainer">
        <div id="topimgcontainer"></div>
        <button type="button" id="closeBtn">X</button>
        <h1 id="whitetext">Daily Feed</h1>
        <h2 id="whitetext2">Scripture a Day</h2>
    <img src="images/jesus_feeds_5000.jpeg" alt="jesus feeds 5000" id="topimg">
    <div id="formContainer">
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>
    </div>
    <div id="bookContainer">
<img src="images/old_testament.webp" alt="Old testament">
<img src="images/new_testament.webp" alt="New testament">
<img src="images/book_of_mormon.webp" alt="Book of Mormon">
<img src="images/doctrine_and_covenants.webp" alt="Doctrine and covenants">
<img src="images/pearl_of_great_price.webp" alt="Pearl of great price">
    </div>
    </div>
    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>
</body>
</html>
